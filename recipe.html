<!DOCTYPE html>
<html>

</head>
<body>

  </nav>

<section class="recipe-detail">
  <img id="recipeImage">
  <h2 id="recipeTitle"></h2>
  <p id="recipeDesc"></p>
</section>

  document.getElementById("recipeTitle").innerText = localStorage.getItem("title");
  document.getElementById("recipeDesc").innerText = localStorage.getItem("desc");
  document.getElementById("recipeImage").src = "images/" + localStorage.getItem("image");
</script>

</body>
</html>
